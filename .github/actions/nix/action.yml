name: Nix dev shell
description: >
  Install Nix and restore one dev shell's store and cargo's build from the
  Actions cache. Each shell has its own store key, so a job never restores
  another shell's closure and builds its own toolchain from source.

inputs:
  shell:
    description: "The flake's dev shell the job enters: rust or docs"
    required: true
  cargo:
    description: "Also cache cargo's registry and target/"
    default: "true"

runs:
  using: composite
  steps:
    # The qahq packages (mmz, outdatty, jscpd, cargo-crap, ejectest, linecop)
    # have no nixpkgs binary cache, so a runner would compile them from source;
    # mmz alone took 476s in the Pages log. Read-only here, since a maintainer's
    # machine fills the caches, and their keys are public. Through `extra-conf`
    # rather than a later append: the daemon reads its trusted keys at startup,
    # so a post-install edit leaves the key unknown and every path built.
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        extra-conf: |
          extra-substituters = https://qahq.cachix.org https://mlavrinenko.cachix.org
          extra-trusted-public-keys = qahq.cachix.org-1:m43yxxOk1vih9jTZmKXZXgHSSKsW/rNVZUqgXqrELM8= mlavrinenko.cachix.org-1:vNcY3Nf5Y1J0D30uNAwrw44CBHbHDd1tGiA18ANz4XY=
    # Caches /nix through the GitHub Actions cache (no external account or
    # token). Replaces the deprecated DeterminateSystems/magic-nix-cache-action.
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ inputs.shell }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ inputs.shell }}-
        gc-max-store-size-linux: 5G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-${{ inputs.shell }}-
        purge-created: 0
        purge-primary-key: never
    # Per job, since coverage and the docs build compile differently. The
    # dependencies are what it saves: a new lock or toolchain starts over.
    - if: inputs.cargo == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
