name: Deploy Pages

on:
  # Every push to main and every `v*` tag deploys the site built from that
  # commit, so a docs change goes live with its push and waits on no release.
  # A page can therefore describe a flag crates.io does not serve yet, until
  # the next release catches up. By hand: `gh workflow run pages.yml`.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: ~

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build docs and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/nix
        with:
          shell: docs

      # The same recipe and dev shell as a local build.
      - name: Build and validate the docs
        run: nix develop .#docs --command just docs-build

      # tola writes a CNAME from the URL's host, and a project page has no
      # custom domain.
      - name: Drop the generated CNAME
        run: rm -f www/public/canibump/CNAME

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: www/public/canibump
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
