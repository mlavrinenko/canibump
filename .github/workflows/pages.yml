name: Deploy Pages

on:
  # After every release, and by hand. Either way it deploys the highest `v*`
  # tag, so the site documents what crates.io serves, never unreleased main,
  # and re-running an old release never rolls it back.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch: ~

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build docs and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      # Before the tag checkout, which may predate the action.
      - uses: ./.github/actions/nix
        with:
          shell: docs
      - name: Check out the latest release
        run: |
          tag=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "::error::no v* tag to deploy"
            exit 1
          fi
          git checkout --quiet "refs/tags/$tag"
          echo "::notice::deploying the site of $tag"

      # The same recipe and dev shell as a local build.
      - name: Build and validate the docs
        run: nix develop .#docs --command just docs-build

      # tola writes a CNAME from the URL's host, and a project page has no
      # custom domain.
      - name: Drop the generated CNAME
        run: rm -f www/public/canibump/CNAME

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: www/public/canibump
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
