name: Deploy Pages

on:
  # No path filter: the site captures the binary built from src/, so a change
  # outside www/ can change a page. Only `just release` pushes main, so the
  # site moves once per release.
  push:
    branches: [main]
  workflow_dispatch: ~

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build docs and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # The same recipe and dev shell as a local build.
      - name: Build and validate the docs
        run: nix develop --command just docs-build

      # tola writes a CNAME from the URL's host, and a project page has no
      # custom domain.
      - name: Drop the generated CNAME
        run: rm -f www/public/canibump/CNAME

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: www/public/canibump
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
