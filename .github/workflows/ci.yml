name: CI

# Runs on every push/PR. We deliberately do NOT use paths-ignore: a required
# status check that never triggers (e.g. on a docs-only PR) blocks merges
# forever. The job is cheap, so it runs unconditionally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: ~

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental state only bloats the target/ cache a fresh runner restores.
  CARGO_INCREMENTAL: 0

# Actions are pinned: first-party actions to immutable release tags, third-party
# actions to commit SHAs. Bump them with Dependabot's `github-actions` ecosystem.
jobs:
  # `just check` is these two halves, each in the narrowest dev shell that
  # runs it, so a code job never builds the docs toolchain.
  code:
    name: Check, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/nix
        with:
          shell: rust
      - name: Check the code
        run: nix develop .#rust --command just check-code

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/nix
        with:
          shell: docs
      - name: Build and check the docs
        run: nix develop .#docs --command just check-docs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/nix
        with:
          shell: rust

      - name: Coverage (fails under 70%)
        run: nix develop .#rust --command just cover

      # CRAP metric: fails if a function is both complex and undertested,
      # which a global coverage threshold can hide. Consumes the lcov that
      # `just cover` wrote.
      - name: CRAP gate (fails above 30)
        run: nix develop .#rust --command just crap

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/nix
        with:
          shell: rust
          cargo: "false"

      # Same recipe as local `just deny`, so CI and a developer's run cannot
      # diverge on which cargo-deny checks are enforced.
      - name: Advisories, licenses, bans
        run: nix develop .#rust --command just deny

  # Every release target, so `just release` sees a broken one before it tags.
  # Not on pull requests: the matrix is slow, and only main gets tagged.
  build:
    name: Build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      # Read the MSRV out of Cargo.toml rather than hardcoding it here: a
      # hardcoded copy silently keeps testing the old version after someone
      # bumps `rust-version`, which is exactly when the job stops meaning
      # anything.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::no rust-version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Check
        run: cargo check --workspace --all-targets
