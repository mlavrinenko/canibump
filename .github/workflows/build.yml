name: Build

# The release targets, called by ci.yml on main (so `just release` waits for
# every target to build before it tags) and by release.yml on the tag (which
# uploads the binaries). One matrix, so the two cannot drift apart.
on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out; empty for the caller's commit"
        type: string
        default: ""
      upload:
        description: "Upload each binary as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.ref }}

      # Cross-platform release binaries are built with rustup rather than Nix
      # (Nix on the Windows/macOS runners is impractical). Pinned to a commit, so
      # the channel must be given explicitly; it tracks rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable channel pinned below
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        if: inputs.upload
        shell: bash
        run: |
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ext=""
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          cp "target/${{ matrix.target }}/release/$name$ext" "$name-${{ matrix.target }}$ext"
          echo "BINARY=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7.0.1
        if: inputs.upload
        with:
          name: ${{ env.BINARY }}-${{ matrix.target }}
          path: ${{ env.BINARY }}-${{ matrix.target }}*
