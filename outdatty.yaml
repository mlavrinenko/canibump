# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/outdatty/main/schema/outdatty.schema.json

# Declares which dependents must be re-confirmed when a source changes. After
# editing a source, review the dependents and run `just outdatty-update` to
# record the new state; `just outdatty-check` (part of `just check`) fails until
# you do. Tune these groups to match where your project's coupled files live.

# Files that must always belong to a group. outdatty defaults to requiring
# EVERY tracked file, which rejects this scaffold's configs, CI, licenses and
# lockfiles that carry no cross-file coupling. List only what is hand-coupled:
# a new source module, doc, or manifest that needs a group of its own also
# belongs here — the `[untracked]` failure message does not say so.
require_tracked:
  - "src/**"
  - "docs/**"
  - "README.md"
  - "CHANGELOG.md"
  - "CONTRIBUTING.md"
  - "AGENTS.md"
  - "Cargo.toml"
  - "Justfile"
  - "scripts/**"
  - "schema/**"
  - "flake.nix"
groups:
  # The CLI, the manifest format, the output and the targets are documented
  # by hand, so any source change flags the user-facing docs for a look.
  - name: cli-docs
    source:
      - "src/**"
    dependents:
      - README.md
      - docs/manifest.md

  # The JSON schema is generated from the manifest types, so a source change
  # flags the committed file and the docs that show how to wire it in.
  - name: schema
    source:
      - "src/**"
    dependents:
      - schema/canibump.schema.json
      - README.md
      - docs/manifest.md

  # A package change (version, dependencies, metadata) should land in the
  # changelog.
  - name: release-notes
    source:
      - Cargo.toml
    dependents:
      - CHANGELOG.md

  # The dev tooling and conventions documented for contributors track the
  # files that define them: the dev shell, the recipes, the test runner's own
  # profile, and the gate memoization rules that decide when a recipe re-runs.
  # `.config/nextest.toml` is a recipe body in practice — `status-level` lives
  # there once, for `just test` and `just cover` — so an edit to it changes what
  # CONTRIBUTING.md and AGENTS.md describe.
  # canibump.toml is a dependent too: each note cites a line of flake.nix or
  # the Justfile, so moving that line flags the note. The scripts/ bodies are
  # sources because AGENTS.md states what the recipes refuse.
  - name: dev-docs
    source:
      - flake.nix
      - Justfile
      - "scripts/**"
      - .config/nextest.toml
      - .mmz/config.yaml
    dependents:
      - CONTRIBUTING.md
      - AGENTS.md
      - canibump.toml
