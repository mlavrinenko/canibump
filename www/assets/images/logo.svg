<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="canibump">
  <!-- An arrow over a bar with a question cut into it: can I bump? The stem
       runs through the shaft to the bar, which stands in for the dot. One
       colour, because the header draws it as a CSS mask tinted with the
       accent (.brand-mark in www/assets/styles/main.css); the question is a
       hole, not a colour. -->
  <mask id="question">
    <rect width="24" height="24" fill="#fff"/>
    <path fill="none" stroke="#000" stroke-width="1.6" d="M9.8 8.3 A2.2 2.2 0 1 1 13.3 10.1 C12.4 10.7 12 11.3 12 12.3 V16.5"/>
  </mask>
  <path fill="#b45309" mask="url(#question)" d="M12 1.5 L20.5 10 H15 V16 H9 V10 H3.5 Z"/>
  <rect fill="#b45309" x="3.5" y="18" width="17" height="2.5" rx="1.25"/>
</svg>
